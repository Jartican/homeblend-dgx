name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    if: github.event.repository.name == 'homeblend-dgx'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run repository secret scanner
        run: python3 scripts/verify-no-secrets.py

      - name: Run public privacy scanner
        run: python3 scripts/verify-public-privacy.py
