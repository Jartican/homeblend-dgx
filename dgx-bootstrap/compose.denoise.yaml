services:
  denoiser:
    build:
      context: ./denoise-service
    image: ${DENOISER_IMAGE:-exocortex/deepfilternet3:local}
    platform: linux/arm64
    container_name: ${DENOISER_CONTAINER:-exocortex-denoiser}
    restart: unless-stopped
    networks:
      - voice-private
    environment:
      DENOISE_ATTENUATION_LIMIT_DB: ${DENOISE_ATTENUATION_LIMIT_DB:-35}
      DENOISE_MAX_AUDIO_BYTES: ${VOICE_MAX_AUDIO_BYTES:-20000000}
      DENOISE_MAX_PCM_BYTES: ${DENOISE_MAX_PCM_BYTES:-12000000}
      DENOISE_MAX_CONCURRENT: ${DENOISE_MAX_CONCURRENT:-1}
      DENOISE_QUEUE_TIMEOUT_SECONDS: ${DENOISE_QUEUE_TIMEOUT_SECONDS:-5}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${DENOISER_MEMORY_LIMIT:-1g}
    cpus: ${DENOISER_CPU_LIMIT:-4.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 10

networks:
  voice-private:
    external: true
    name: ${EXOCORTEX_VOICE_NETWORK:-exocortex-voice}
