name: homeblend-harness

services:
  harness:
    build:
      context: ./homeblend-harness
    image: ${HOMEBLEND_HARNESS_IMAGE:-homeblend/harness:local}
    container_name: ${HOMEBLEND_HARNESS_CONTAINER:-homeblend-harness}
    restart: unless-stopped
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOMEBLEND_FAST_MODEL: ${MODEL_FAST_ALIAS:-exocortex-chat-fast}
      HOMEBLEND_FAST_BASE_URL: http://127.0.0.1:${VLLM_PORT:-8001}/v1
      HOMEBLEND_FAST_API_KEY: ${HOMEBLEND_FAST_API_KEY:-local-vllm}
      HOMEBLEND_QUALITY_MODEL: ${MODEL_QUALITY_ALIAS:-exocortex-agent-quality}
      # Fresh installs route the quality alias through the authenticated
      # loopback LiteLLM service. Do not depend on the legacy hand-built SGLang
      # listener that happened to exist on the original Spark.
      HOMEBLEND_QUALITY_BASE_URL: http://127.0.0.1:${LITELLM_PORT:-4000}/v1
      HOMEBLEND_QUALITY_API_KEY: ${LITELLM_KEY:?Set LITELLM_KEY in stack.env}
      HOMEBLEND_MCP_URL: http://127.0.0.1:${MCP_GATEWAY_PORT:-8766}/mcp
      HOMEBLEND_REPO_ROOT: /workspace
      HOMEBLEND_MAX_TURNS: ${HOMEBLEND_MAX_TURNS:-8}
      HOMEBLEND_MAX_TOOL_CALLS: ${HOMEBLEND_MAX_TOOL_CALLS:-12}
      HOMEBLEND_MAX_OUTPUT_TOKENS: ${HOMEBLEND_MAX_OUTPUT_TOKENS:-4096}
    volumes:
      - ${HOMEBLEND_REPO_PATH:?Set HOMEBLEND_REPO_PATH in stack.env}:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
