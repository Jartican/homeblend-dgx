services:
  neural-wake:
    build:
      context: ./wake-service
    image: ${NEURAL_WAKE_IMAGE:-exocortex/neural-wake:local}
    platform: linux/arm64
    container_name: ${NEURAL_WAKE_CONTAINER:-exocortex-neural-wake}
    restart: unless-stopped
    networks:
      - voice-private
    environment:
      KWS_WAKE_WORD: ${VOICE_WAKE_WORD:-Gauss}
      KWS_WAKE_ALIASES: ${VOICE_WAKE_ALIASES:-gauss,goss,gouse,gauze}
      KWS_THREADS: ${NEURAL_WAKE_THREADS:-2}
      KWS_KEYWORDS_SCORE: ${NEURAL_WAKE_SCORE:-2.75}
      KWS_KEYWORDS_THRESHOLD: ${NEURAL_WAKE_THRESHOLD:-0.12}
      # Browser clips share one streaming session. Artificial silence between
      # clips breaks a wake word that straddles a boundary.
      KWS_TAIL_PADDING_MS: ${NEURAL_WAKE_TAIL_PADDING_MS:-0}
      KWS_MAX_CHUNK_BYTES: ${NEURAL_WAKE_MAX_CHUNK_BYTES:-640000}
      KWS_SESSION_TTL_SECONDS: ${NEURAL_WAKE_SESSION_TTL_SECONDS:-30}
      KWS_MAX_SESSIONS: ${NEURAL_WAKE_MAX_SESSIONS:-16}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${NEURAL_WAKE_MEMORY_LIMIT:-512m}
    cpus: ${NEURAL_WAKE_CPU_LIMIT:-2.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 10

networks:
  voice-private:
    external: true
    name: ${EXOCORTEX_VOICE_NETWORK:-exocortex-voice}
