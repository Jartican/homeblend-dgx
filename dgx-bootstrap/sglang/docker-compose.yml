services:
  sglang-qwen:
    image: lmsysorg/sglang:v0.5.18
    container_name: sglang-qwen3.8-server
    environment:
      HOME: /root
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "127.0.0.1:30000:30000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    command:
      - sglang
      - serve
      - --model-path
      - RadixArk/Qwen3.8-27B-NVFP4
      - --served-model-name
      - exocortex-agent-quality
      - --mem-fraction-static
      - "0.45"
      - --chunked-prefill-size
      - "8192"
      - --context-length
      - "131072"
      - --cuda-graph-max-bs-decode
      - "16"
      - --port
      - "30000"
      - --host
      - 0.0.0.0
